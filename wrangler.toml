name = "estate-podium"
main = "server.ts"
compatibility_date = "2026-05-25"

# ----------------------------
# ENV VARIABLES
# ----------------------------
[vars]
NODE_ENV = "production"
JWT_SECRET = "estate_podium_secret_key_2026_secured"

# ----------------------------
# D1 DATABASE (SQL)
# ----------------------------
[[d1_databases]]
binding = "DB"
database_name = "estate-podium-d1"
database_id = "fcd30881-5e7e-4e04-b205-c3c8b2b63a9e"

# ----------------------------
# R2 STORAGE (IMAGES)
# ----------------------------
[[r2_buckets]]
binding = "R2"
bucket_name = "estate-images"

# IMPORTANT:
# use binding name "R2" in code:
# env.R2.put(...)
# env.R2.get(...)

# ----------------------------
# BUILD OUTPUT (FRONTEND)
# ----------------------------
[site]
bucket = "./dist"

# ----------------------------
# PRODUCTION ENV
# ----------------------------
[env.production]
vars = { NODE_ENV = "production" }

# ----------------------------
# COMPATIBILITY SETTINGS
# ----------------------------
compatibility_flags = ["nodejs_compat"]
