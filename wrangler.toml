name = "estate-podium"
main = "server.ts"
compatibility_date = "2026-05-25"

# Environment variables
[vars]
NODE_ENV = "production"
JWT_SECRET = "estate_podium_secret_key_2026_secured"

# 1. Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "estate-podium-d1"
database_id = "fcd30881-5e7e-4e04-b205-c3c8b2b63a9e"

# 2. Cloudflare R2 Bucket binding
[[r2_buckets]]
binding = "R2_IMAGERY"
bucket_name = "estate-images"

# IMPORTANT FIX:
# R2 bucket name must EXACTLY match Cloudflare dashboard:
# estate-images (NOT estate-podium-imagery)

# Pages build output
[site]
bucket = "./dist"

# Production environment
[env.production]
vars = { NODE_ENV = "production" }
